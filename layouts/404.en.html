{{ define "main" }}

<section class="section-dark min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Decorative shapes -->
  <div class="absolute top-20 left-10 w-40 h-40 rounded-full bg-white/5 parallax-bg" data-speed="0.2"></div>
  <div class="absolute bottom-20 right-10 w-56 h-56 rounded-full bg-white/5 parallax-bg" data-speed="0.3"></div>
  <div class="absolute top-1/3 right-1/4 w-20 h-20 rounded-lg bg-white/5 rotate-45 parallax-bg" data-speed="0.15"></div>

  <div class="container text-center relative z-10 py-20">
    <!-- Glitch 404 -->
    <h1 class="glitch-text leading-none mb-6 reveal-up" data-text="404">
      404
    </h1>

    <h2 class="text-2xl lg:text-4xl font-bold mb-4 reveal-up">
      Page not found
    </h2>

    <p class="text-white/50 text-lg max-w-md mx-auto mb-10 reveal-up">
      The page you're looking for doesn't exist or has been moved.
    </p>

    <a href="{{ "/" | relURL }}" class="btn-primary-custom magnetic-btn reveal-up">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Back to Home
    </a>
  </div>
</section>

{{ end }}
